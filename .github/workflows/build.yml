name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SameGuidPathDedup.dll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SameGuidPathDedup/SameGuidPathDedup.csproj

      - name: Build (netstandard2.0, Release)
        run: >
          dotnet build SameGuidPathDedup/SameGuidPathDedup.csproj
          --no-restore
          -c Release
          -p:TargetFrameworks=netstandard2.0

      - name: Copy artifact
        run: |
          mkdir -p artifacts/1.0.0.0
          DLL=$(find SameGuidPathDedup/bin/Release -name 'SameGuidPathDedup.dll' | head -n 1)
          PDB=$(find SameGuidPathDedup/bin/Release -name 'SameGuidPathDedup.pdb' | head -n 1)
          if [ -z "$DLL" ]; then
            echo "ERROR: SameGuidPathDedup.dll not found"
            exit 1
          fi
          cp -f "$DLL" artifacts/1.0.0.0/SameGuidPathDedup.dll
          if [ -n "$PDB" ]; then
            cp -f "$PDB" artifacts/1.0.0.0/SameGuidPathDedup.pdb
          fi
          ls -la artifacts/1.0.0.0/
          echo "BUILD_SIZE_BYTES=$(wc -c < artifacts/1.0.0.0/SameGuidPathDedup.dll)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SameGuidPathDedup-dll
          path: artifacts/1.0.0.0/SameGuidPathDedup.dll
          if-no-files-found: error

      - name: Attach DLL to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/1.0.0.0/SameGuidPathDedup.dll
          fail_on_unmatched_files: true